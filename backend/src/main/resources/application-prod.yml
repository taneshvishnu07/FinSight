spring:

  # Production profile: every secret and address comes from environment variables (DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, JWT_SECRET, FINSIGHT_AI_SERVICE_URL, optional PORT / JWT_EXPIRATION).
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      # Hibernate only checks the schema matches the entities; it never changes it in production.
      ddl-auto: validate

    show-sql: false


server:
  port: ${PORT:8080}


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}



finsight:
  currency:
    code: MYR
    symbol: RM
  ai-service:
    url: ${FINSIGHT_AI_SERVICE_URL:http://127.0.0.1:8000}
