<!DOCTYPE html>
<!-- FinSight File Notes: Defines the registration page where a new user creates a FinSight account. -->
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | FinSight</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand centered" href="index.html"><span class="brand-mark"><i class="bi bi-bar-chart-fill"></i></span>FinSight</a>
      <h1>Create an Account</h1>
      <p class="muted">Join FinSight to start understanding your financial behaviour.</p>
      <form id="registerForm" novalidate>
        <label>Full Name
          <input id="name" required maxlength="100" autocomplete="name" placeholder="e.g. John Smith">
          <small class="field-help">Enter your first and last name.</small>
        </label>
        <label>Email Address
          <input id="email" type="email" required maxlength="150" autocomplete="email" placeholder="e.g. john@example.com">
          <small class="field-help">Use a valid email address that you can use to log in.</small>
        </label>
        <label>Password
          <div class="password-wrap"><input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Create a strong password"><button type="button" class="icon-btn" data-toggle-password="#password"><i class="bi bi-eye"></i></button></div>
          <div class="password-strength"><div class="password-strength-top"><small>Password strength</small><strong id="passwordStrengthLabel">Enter a password</strong></div><div class="password-strength-track"><b id="passwordStrengthBar"></b></div></div>
          <div id="passwordRequirements" class="password-requirements">
            <span data-check="length"><i class="bi bi-circle"></i> 8 or more characters</span>
            <span data-check="lowercase"><i class="bi bi-circle"></i> Lowercase letter</span>
            <span data-check="uppercase"><i class="bi bi-circle"></i> Uppercase letter</span>
            <span data-check="number"><i class="bi bi-circle"></i> Number</span>
            <span data-check="special"><i class="bi bi-circle"></i> Special character</span>
          </div>
        </label>
        <label>Confirm Password
          <input id="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Repeat your password">
        </label>
        <div id="formMessage" class="form-message"></div>
        <button class="btn btn-dark full" type="submit">Register</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Back to Login</a></p>
      <small class="legal-note">By creating an account, you agree to use FinSight for personal financial analysis.</small>
    </section>
  </main>
  <script src="js/api.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script>
</body>
</html>
