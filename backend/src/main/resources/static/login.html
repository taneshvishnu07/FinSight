<!DOCTYPE html>
<!-- FinSight File Notes: Defines the login page where an existing user authenticates to FinSight. -->
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FinSight</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand centered" href="index.html"><span class="brand-mark"><i class="bi bi-bar-chart-fill"></i></span>FinSight</a>
      <h1>Welcome Back</h1>
      <p class="muted">Enter your credentials to access your financial insights.</p>
      <form id="loginForm">
        <label>Email Address<input id="email" type="email" required placeholder="alex@example.com"></label>
        <label>Password<div class="password-wrap"><input id="password" type="password" required placeholder="••••••••"><button type="button" class="icon-btn" data-toggle-password="#password"><i class="bi bi-eye"></i></button></div></label>
        <div id="formMessage" class="form-message"></div>
        <button class="btn btn-dark full" type="submit">Login to Dashboard</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="register.html">Register now</a></p>
      <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to home</a>
    </section>
  </main>
  <script src="js/api.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script>
</body>
</html>
