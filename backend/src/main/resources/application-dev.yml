# FinSight File Notes: Contains application configuration values and environment-variable mappings for this deployment profile.
spring:

  datasource:
    url: jdbc:mysql://localhost:3306/finsight?createDatabaseIfNotExist=true&serverTimezone=Asia/Kuala_Lumpur
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


server:
  port: 8080


jwt:
  secret: ${JWT_SECRET:local-development-only-change-this-secret}
  expiration: 86400000


logging:
  level:

    org.springframework.security: DEBUG

    org.hibernate.SQL: DEBUG

    org.hibernate.orm.jdbc.bind: TRACE

finsight:
  currency:
    code: MYR
    symbol: RM
  ai-service:
    # Local development always uses the HTTP FastAPI/Uvicorn service.
    url: http://127.0.0.1:8000
