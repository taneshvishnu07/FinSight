spring:

  # Local development profile (SPRING_PROFILES_ACTIVE=dev). DB_USERNAME, DB_PASSWORD and JWT_SECRET come from environment variables (see backend/env.example); MySQL runs on localhost:3306 and the "finsight" database is created automatically.
  datasource:
    url: jdbc:mysql://localhost:3306/finsight?createDatabaseIfNotExist=true&serverTimezone=Asia/Kuala_Lumpur
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Hibernate creates/updates tables automatically (dev only; prod uses "validate").
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      # Upload limit. Keep in sync with MAX_FILE_SIZE in UploadServiceImpl.
      max-file-size: 10MB
      max-request-size: 10MB


server:
  port: 8080


jwt:
  # Base64 signing key for JWTs, read from the JWT_SECRET environment variable. expiration is in milliseconds (86400000 = 24 h).
  secret: ${JWT_SECRET}
  expiration: 86400000


logging:
  # Verbose SQL / security logging for debugging; remove or lower for production.
  level:

    org.springframework.security: DEBUG

    org.hibernate.SQL: DEBUG

    org.hibernate.orm.jdbc.bind: TRACE

finsight:
  currency:
    code: MYR
    symbol: RM
  # Base URL of the Python FastAPI AI service (see backend/ai-service). Local addresses are normalised by AiServiceUrlResolver.
  ai-service:
    # Local development always uses the HTTP FastAPI/Uvicorn service.
    url: http://127.0.0.1:8000
